spring:
  application:
    name: ansimi-backend
  config:
    import: optional:file:.env[.properties]   # 로컬: 저장소 루트의 .env를 읽음 (운영은 컨테이너 환경변수)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate   # 테이블은 Flyway가 만든다
    open-in-view: false
  flyway:
    locations: classpath:db/migration

app:
  tmap:
    base-url: https://apis.openapi.sk.com
    app-key: ${TMAP_APP_KEY:}
    timeout-ms: 5000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  route:
    min-distance-m: 50
    max-distance-m: 5000
