# VM에 /etc/nginx/sites-available/ansimi 로 복사하고 sites-enabled에 심볼릭 링크 건 뒤
# `sudo certbot --nginx -d api.<도메인>` 실행 (개발 명세 9장).
# certbot이 이 파일에 ssl_certificate 등 HTTPS 설정을 자동으로 추가해준다.
server {
    server_name api.<도메인>;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
